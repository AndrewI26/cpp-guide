# cpp-guide: the textbook site. Practice code runs in visitors' browsers, never on this server.
#   docker compose up -d --build --remove-orphans
# The site is published on 127.0.0.1:8010 only; Caddy (on the host) proxies cpp.andrewi.ca to it.

services:
  web:
    build: .
    image: cpp-guide:latest
    command: ["cpp-guide", "serve", "--host", "0.0.0.0", "--port", "8000", "--no-watch", "--no-build"]
    ports:
      - "127.0.0.1:8010:8000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    restart: unless-stopped
