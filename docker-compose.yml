# cpp-guide: the textbook site plus an isolated code runner.
#   docker compose up -d --build
# The site is published on 127.0.0.1:8010 only; Caddy (on the host) proxies cpp.andrewi.ca to it.

services:
  web:
    build: .
    image: cpp-guide:latest
    command: ["cpp-guide", "serve", "--host", "0.0.0.0", "--port", "8000",
              "--no-watch", "--no-build", "--runner-url", "http://runner:9000"]
    ports:
      - "127.0.0.1:8010:8000"
    networks: [public, sandbox]
    depends_on: [runner]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    restart: unless-stopped

  # Compiles and executes untrusted C++. It's only on the internal "sandbox" network, so submitted
  # programs have no route to the internet or the host's other services.
  runner:
    image: cpp-guide:latest
    command: ["cpp-guide", "runner", "--host", "0.0.0.0", "--port", "9000"]
    networks: [sandbox]
    environment:
      CPPGUIDE_MAX_JOBS: "2"
      TMPDIR: /tmp
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,size=512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    ulimits:
      nofile: 1024
      fsize: 104857600   # 100 MB max file size
    restart: unless-stopped

networks:
  public: {}
  sandbox:
    internal: true
